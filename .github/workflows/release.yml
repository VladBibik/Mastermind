name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Read Maven project version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Read Git tag version
        run: |
          TAG="${{ github.ref_name }}"
          TAG=${TAG#v}

          echo "TAG_VERSION=$TAG" >> $GITHUB_ENV

      - name: Verify versions match
        run: |
          echo "Comparing project version with Git tag..."
          
          echo "Maven version: $PROJECT_VERSION"
          echo "Git tag:       $TAG_VERSION"

          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch!"
            echo "::error::pom.xml: $PROJECT_VERSION"
            echo "::error::Git tag: $TAG_VERSION"
            exit 1
          fi

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: mastermind-jar
          path: target/mastermind.jar

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v5
        with:
          name: mastermind-jar
          path: target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mastermind:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mastermind:${{ github.ref_name }}

  windows:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v5
        with:
          name: mastermind-jar
          path: target

      - name: Verify downloaded JAR
        shell: pwsh
        run: |
          Get-ChildItem target

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Copy runtime dependencies
        shell: pwsh
        run: mvn dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependencies

      - name: Determine modules and create runtime
        shell: pwsh
        run: |
          $modules = jdeps `
          --print-module-deps `
          --ignore-missing-deps `
          --multi-release 24 `
          --class-path "target/dependencies/*" `
          target/mastermind.jar

          Write-Host "Required Java modules: $modules"
      
          jlink `
          --add-modules $modules `
          --output target/mastermind-runtime `
          --strip-debug `
          --no-man-pages `
          --no-header-files `
          --compress=2

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/jpackage-input
          Copy-Item target/mastermind.jar target/jpackage-input/mastermind.jar

      - name: Create release with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          
          jpackage `
            --name Mastermind `
            --input target/jpackage-input `
            --main-jar mastermind.jar `
            --main-class dev.bibikvlad.mastermind.app.bootstrap.MastermindAppLauncher `
            --type app-image `
            --win-console `
            --dest release `
            --icon assets/mastermind.ico `
            --runtime-image target/mastermind-runtime `
            --java-options "--enable-native-access=ALL-UNNAMED"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          
          Compress-Archive `
            -Path release/Mastermind `
            -DestinationPath "Mastermind-$version-windows-x64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v5
        with:
          name: mastermind-windows
          path: Mastermind-*-windows-x64.zip

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v5
        with:
          name: mastermind-jar
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v5
        with:
          name: mastermind-windows
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/mastermind.jar \
            release/Mastermind-*-windows-x64.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes