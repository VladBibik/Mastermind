name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Read Maven project version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Read Git tag version
        run: |
          TAG="${{ github.ref_name }}"
          TAG=${TAG#v}

          echo "TAG_VERSION=$TAG" >> $GITHUB_ENV

      - name: Verify versions match
        run: |
          echo "Comparing project version with Git tag..."
          
          echo "Maven version: $PROJECT_VERSION"
          echo "Git tag:       $TAG_VERSION"

          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch!"
            echo "::error::pom.xml: $PROJECT_VERSION"
            echo "::error::Git tag: $TAG_VERSION"
            exit 1
          fi

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: mastermind-jar
          path: target/mastermind.jar

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v5
        with:
          name: mastermind-jar
          path: target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mastermind:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mastermind:${{ github.ref_name }}

  windows:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v5
        with:
          name: mastermind-jar
          path: target

      - name: Verify downloaded JAR
        shell: pwsh
        run: |
          Get-ChildItem target

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Determine required Java modules
        shell: pwsh
        run: |
          jdeps `
            --print-module-deps `
            --ignore-missing-deps `
            --multi-release 24 `
            target/mastermind.jar

      - name: Resolve dependencies using Maven
        shell: pwsh
        run: mvn dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependencies

      - name: Get dependencies using jdeps
        shell: pwsh
        run: |
          jdeps `
            --print-module-deps `
            --ignore-missing-deps `
            --multi-release 24 `
            --class-path "target/dependencies/*" `
            target/mastermind.jar

      - name: Create minimal required env using jlink
        shell: pwsh
        run: |
          jlink `
          --add-modules java.base,java.sql `
          --output target/mastermind-runtime `
          --strip-debug `
          --no-man-pages `
          --no-header-files `
          --compress=2 `
