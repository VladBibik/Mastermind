compatibility_warning=Вы собираетесь включить режим совместимости.\n\
В режиме совместимости все эмодзи, символы подсказок и цвета будут либо изменены,\n\
либо отключены, чтобы обеспечить правильное отображение игры.\n\
В режиме совместимости доступна только английская локализация.\n\
Это необходимо для обеспечения корректного отображения текста и символов.\n\
\n\
Вы можете отключить режим совместимости в одном из следующих меню:\n\
Настройки > Режим совместимости; \
либо:\n\
Настройки > Язык > выберите любой язык.\n\
\n\
Нажмите 'Enter', чтобы продолжить, или '0', чтобы вернуться в меню настроек.