compatibility_warning=You're about to turn off Compatibility Mode.\n\
\n\
⬤◍○✅❌🎉[91m⬤[92m⬤[93m⬤[94m⬤[95m⬤[97m⬤[0m\n\
If any symbol above is displayed weirdly, for example, instead of a symbol you have '?' or '?' in the box,\n\
or you can see weird code, it means that your terminal can't render symbols correctly.\n\
If you encounter any of these issues,\n\
we recommend staying in Compatibility Mode to ensure that the game is displayed correctly.\n\
\n\
After Compatibility Mode is turned off, the app language will automatically be changed to English.\n\
You can select your preferred language again from Settings > Language.\n\
\n\
Press 'Enter' to proceed, or '0' to return to the Settings Menu.