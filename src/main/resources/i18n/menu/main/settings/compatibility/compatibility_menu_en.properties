compatibility_warning=You're about to turn on Compatibility Mode.\n\
Compatibility Mode uses simplified symbols, disables clue and result colors,\n\
and makes the logo monochrome to ensure that the game is displayed correctly\n\
in terminals with limited support for these features.\n\
\n\
You can turn off Compatibility Mode at any time from either of these locations:\n\
Settings > Compatibility Mode\n\
or:\n\
Settings > Language > choose any language.\n\
\n\
Press 'Enter' to proceed, or '0' to return to the Settings Menu.