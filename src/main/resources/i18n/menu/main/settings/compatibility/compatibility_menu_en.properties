compatibility_warning=You're about to turn on Compatibility Mode.\n\
Compatibility Mode uses simplified symbols and disables some colors and visual elements to ensure\n\
that the game is displayed correctly in terminals that have limited support for these features.\n\
Only English localization is available in Compatibility Mode.\n\
This is necessary to ensure that all text and symbols are displayed correctly.\n\
\n\
You can turn off Compatibility Mode at any time from either of these menus:\n\
Settings > Compatibility Mode; \
or:\n\
Settings > Language > choose any language.\n\
\n\
Press 'Enter' to proceed, or '0' to return to the Settings Menu.