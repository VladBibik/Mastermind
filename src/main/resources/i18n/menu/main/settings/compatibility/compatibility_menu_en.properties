compatibility_warning=You're about to turn on Compatibility Mode.\n\
In Compatibility Mode, all emojis, clue symbols, and colors will be either changed,\n\
or turned off, to ensure that the game is displayed properly.\n\
The only localization that is available in the Compatibility Mode is English\n\
\n\
You can turn off compatibility mode either in:\n\
Settings > Compatibility Mode; \
or:\n\
Settings > Language > choose any language.\n\
\n\
Press 'Enter' to proceed, or '0' to return to the Settings Menu.