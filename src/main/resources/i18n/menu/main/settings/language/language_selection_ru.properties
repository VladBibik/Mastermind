compatibility_warning=Вы выбрали режим совместимости.\n\
\n\
В режиме совместимости используются упрощённые символы, отключаются цвета подсказок и результата,\n\
а логотип становится одноцветным, чтобы обеспечить корректное отображение игры\n\
в терминалах с ограниченной поддержкой этих функций.\n\
В режиме совместимости доступна только английская локализация.\n\
Это необходимо для обеспечения корректного отображения текста и символов.\n\
\n\
Вы можете отключить режим совместимости в одном из следующих мест:\n\
Настройки > Режим совместимости\n\
или:\n\
Настройки > Язык > выберите любой язык, кроме режима совместимости.
compatibility_selected=Режим совместимости включён.\n\
\n\
⬤◍○✅❌🎉[91m⬤[92m⬤[93m⬤[94m⬤[95m⬤[97m⬤[0m\n\
\n\
Если какой-либо из приведённых выше символов отображается некорректно, например,\n\
в виде вопросительных знаков, квадратов или других непредвиденных символов,\n\
мы рекомендуем оставить режим совместимости включённым, чтобы обеспечить корректное отображение игры.